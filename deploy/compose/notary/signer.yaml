# The notary's own signer (docs/notary.md): one public tenant for agents, a policy that only flags, and only the notary
# (uid 10015, its compose user) reaches it. The notary reads its store (group 10001, read-only) for receipts and
# exports, never its keys.
data_dir: /var/lib/tracekit-notary-signer
socket: /run/tracekit-notary/signer.sock
socket_mode: "0666"                          # only the notary container mounts the socket's volume
durability: ack-on-fsync
metrics: {listen: 127.0.0.1:9464}            # the image HEALTHCHECK reads it
policy: /etc/tracekit/notary/policy.yaml
notaries: ["uid:10015"]                      # registers runs for, and records the actions of, the agents it authenticated
authorize:                                   # never-default grants: only what the notary and its agents need
  "uid:10015": [register_run, decide, complete, close_run, checkpoint_nudge]
  "token:*": [register_run, decide, complete, close_run]
