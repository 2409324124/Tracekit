<html><head><meta charset="utf-8">

<style>
:root{--bg:#0e0d0c;--grid:rgba(255,236,210,.05);--ink:#ece6da;--soft:#a79f92;--line:rgba(255,236,210,.13);--card:#171513;--amber-ink:#f1b23c}
html.light{--bg:#f4efe6;--grid:rgba(60,40,15,.06);--ink:#24201c;--soft:#5d554b;--line:rgba(60,40,15,.15);--card:#fffdf8;--amber-ink:#a8690a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:360px;overflow:hidden;background:transparent}
.frame{position:absolute;inset:0;border-radius:18px;overflow:hidden;background-color:var(--bg);padding:34px 48px;

body{font-family:Archivo,sans-serif;color:var(--ink);position:relative}
.row{display:flex;gap:44px}.row+.row{margin-top:26px}
.gl{font:600 13.5px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-ink);margin-bottom:12px}
.tiles{display:flex;gap:12px}
.tile{width:120px;height:104px;border:1px solid var(--line);background:var(--card);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.nm{font:600 13px/1.15 Archivo,sans-serif;text-align:center;padding:0 6px}
.mono{width:34px;height:34px;border-radius:8px;border:2px solid currentColor;font:800 14px/30px Archivo;text-align:center}
</style>
