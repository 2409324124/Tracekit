<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="%CSP%">
<title>tracekit verify</title>
<style>
pre { white-space: pre-wrap; }
</style>
</head>
<body>
<main id="drop">
<h1>tracekit verify</h1>
<p>bundle (.tkb): <input type="file" id="bundle" accept=".tkb,.zip,.json" multiple> <b id="bundle-name">none chosen</b><br>
trust.json (optional): <input type="file" id="trust" accept=".json"> <b id="trust-name">none</b>
<button type="button" id="clear-trust" hidden>remove</button><br>
samples: <button type="button" id="sample-clean">clean</button> <button type="button" id="sample-tampered">tampered</button></p>
<hr>
<section id="result" hidden aria-live="polite">
<div id="banner"><h2 id="verdict-word"></h2><p id="verdict-means"></p><p id="verdict-not"></p></div>
<div id="next" hidden><h3>what to do next</h3><ol id="steps"></ol></div>
<div id="summary-box" hidden><h3 id="summary-title"></h3><dl id="summary"></dl></div>
<h3>checks</h3>
<div id="checks"></div>
<p id="integrity"></p>
<p id="assurance"></p>
<p id="exit"></p>
<p><button type="button" id="copy">copy report</button> <button type="button" id="download">download JSON</button>
<span id="copied"></span></p>
<details><summary>report as text</summary><pre id="report"></pre></details>
<hr>
</section>
<p id="busy" hidden>Verifying...</p>
<p><small>tracekit <span id="version"></span> · same checks as <code>tracekit verify</code> · files never leave this
page</small></p>
</main>
<script id="verifier" type="module">%SCRIPT%</script>
</body>
</html>
