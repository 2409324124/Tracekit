# Coding pack (policy v2): the shell, files and harness self-protection rules of tracekit/policy/default.yaml,
# ported to the RE2 subset and to signer-side classes. Rule ids are kept where the meaning is the same.
#
# Shell rules without a field match each command's argv (wrappers, paths, quoting and the program name's case resolved
# by policy2/shell.py); `field: command` matches the raw command line; `field: line` matches it and each line
# policy2/shell.py normalised (quotes and escapes resolved, redirections kept), as typed and again with its program
# names in lower case. File rules match the signer-normalised `path` (and, with `..`, the lexically normalised one),
# with `\` as `/` and also casefolded (the agent's file system may ignore case). Rules stay tripwires: the protection
# is the signer, its storage and the witnesses.

version: '2026.10-v2-12'
description: coding agents on a laptop (Claude Code, Codex, Cursor, Gemini)
# laptop: a tool the pack does not map is flagged, not held; server.yaml holds it for a person (ask)
unknown_tools: flag

tools:
  Bash: shell
  run_shell_command: shell   # Gemini CLI
  shell: shell               # Codex, OpenAI Agents ShellTool
  local_shell: shell         # OpenAI Agents LocalShellTool
  container.exec: shell      # OpenAI hosted container
  run_terminal_cmd: shell    # Cursor
  terminal: shell            # LangChain ShellTool
  Write: fs
  Edit: fs
  MultiEdit: fs
  NotebookEdit: fs
  Read: fs
  Grep: fs
  Glob: fs
  WebFetch: http
  WebSearch: http
  'srt:request': http        # a request srt-proxy asks about (tracekit srt-decider)
  'mcp__*': mcp
  'mcp:*/*': mcp

# tool classes and tool names whose results are untrusted content (the signer's provenance index)
untrusted: [http, mcp, WebFetch, WebSearch]

deny:
  # --- shell ---
  - id: TK-D001
    class: shell
    pattern: '^(sudo|sudoedit|doas|pkexec)( |$)|^su (.* )?(-c|root)( |$)'
    reason: privilege escalation
    rationale: An agent should never need root; escalation widens every other risk and would let it reach the signer.
  - id: TK-D002
    class: shell
    field: line
    pattern: '(curl|wget)[^|;&]*\|\s*(sudo\s+)?(\S*/)?((ba|z|da)?sh|python3?|perl|ruby|node)\b|(ba|z)?sh\s+<\(\s*(curl|wget)|\$\(\s*(curl|wget)|\b(curl|wget)\b[^\n]*(&&|;)\s*(sudo\s+)?((ba|z|da)?sh\s+\S|\./\S|chmod\s+\+x[^\n]*(&&|;)\s*\./)|\b(exec|eval)\(\s*[A-Za-z_.]*urlopen'
    reason: running a downloaded script
    rationale: Remote code execution without review.
  - id: TK-D003
    class: shell
    field: line
    # global options may come before `push` (git -C dir push); -f may be bundled (-uf); --mirror may be abbreviated
    # (`--m`: push's only option starting with m). `.` doesn't cross a newline in the raw line, so a heredoc after a push
    # (`gh pr create --body "$(cat <<EOF`) isn't read as its arguments; the normalised line joins commands with ` ; `,
    # so a later command on that line still is. Lazy: one push stays linear on the fallback engine, many in one long
    # command don't (the pattern isn't anchored)
    pattern: 'git\s+(-[Cc]\s+\S+\s+|--?[A-Za-z][-A-Za-z]*(=\S*)?\s+){0,8}push\b.*?(--force\b|\s-[A-Za-z]*f[A-Za-z]*\b|--force-with-lease|--m(i|ir|irr|irro|irror)?\b|\s\+\S)'
    reason: force push
    rationale: Rewrites shared history.
  - id: TK-D004
    class: shell
    pattern: '^rm [-A-Za-z ]*-[A-Za-z]*[rR][-A-Za-z ]* (/|~|\$HOME|\$\{HOME\}|/home|/Users|/root)/?\*?( |$)|^find / .*-delete( |$)'
    reason: recursive delete of root or home
    rationale: Irrecoverable data loss.
  - id: TK-D010
    class: shell
    field: line
    # every .env variant, templates included: a whole command can name several files, so no `unless` here
    pattern: '(>>?|\btee\b(\s+-a)?)\s*\S*(\.env(\.[A-Za-z0-9._-]+)?|id_rsa|id_ed25519|authorized_keys|\.aws/credentials)(\s|$|[;&|)''"])|\b(cp|mv|install)\b[^\n|;&]*\s\S*(\.env(\.[A-Za-z0-9._-]+)?|id_rsa|id_ed25519|authorized_keys|\.aws/credentials)\s*($|[;&|)])'
    reason: writing to a credentials file from the shell
    rationale: The shell twin of TK-D005. Redirects, tee, cp and mv reach the same files the file-editing tools are blocked from.
  - id: TK-D011
    class: shell
    field: line
    pattern: '\b(cat|tar|zip|base64|gzip)\b[^\n]*(\.ssh|id_rsa|id_ed25519|\.aws|\.netrc|/etc/shadow|/etc/passwd)[^\n]*\|\s*(curl|nc|ncat|socat|wget)\b|\b(scp|rsync|curl|wget)\b[^\n]*(\.ssh/|id_rsa|id_ed25519|\.aws/credentials|\.netrc|--post-file[ =]/etc/(passwd|shadow))'
    reason: sending credential files off the machine
    rationale: Keys and cloud credentials leaving the host are exfiltration. TK-D006 covers .env files.
  - id: TK-D006
    class: shell
    field: line
    pattern: '\bcat\s+\S*\.env\b[^\n]*\|\s*(curl|wget|nc|ncat)\b|(curl|wget|http|nc|ncat|scp|rsync)\b[^\n]*(@\S*\.env\b|--data[-a-z]*[ =]@?\S*\.env\b|--upload-file\s+\S*\.env\b|--post-file[ =]\S*\.env\b|\s\S*\.env\s+\S+:|<\s*\S*\.env\b)'
    reason: uploading a secrets file
    rationale: Sending .env off the machine is exfiltration.
  - id: TK-D008
    class: shell
    field: line
    pattern: '(\brm\b|\bunlink\b|\btruncate\b|\bshred\b|\bsed\s+(-[a-zA-Z]*\s+)*-i|\bperl\s+-[a-zA-Z]*i|\bmv\b|\bln\s+-[a-zA-Z]*f|\bdd\b[^\n]*\bof=|\btee\b|>|\bfind\b[^\n]*-(delete|exec\s+(rm|truncate|sed)))[^\n]*(\.claude/projects|\.codex/sessions|\.gemini/tmp|\.config/opencode)|\bfind\s[^\n]*(\.claude/projects|\.codex/sessions|\.gemini/tmp|\.config/opencode)[^\n]*-(delete|exec\s+(rm|truncate|sed|shred))'
    reason: modifying the agent harness's transcripts
    rationale: Transcripts are evidence; the agent has no reason to write them. Reading them is allowed.

  # --- files ---
  - id: TK-D005
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(\.env(\.[A-Za-z0-9._-]+)?|id_rsa|id_ed25519|credentials)$|(^|/)\.ssh/|(^|/)\.aws/'
    unless: '(^|/)\.[Ee][Nn][Vv]\.([Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])$'
    reason: writing to a credentials file
    rationale: Credential files are high-value and rarely a legitimate agent target.
  - id: TK-D009
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(\.claude/projects|\.codex/sessions|\.gemini/tmp|\.config/opencode)/'
    # Claude Code keeps the agent's own memory notes beside its transcripts: those it may write
    unless: '(^|/)\.claude/projects/[^/]+/memory/[^/]+\.md$'
    reason: writing to the agent harness's transcripts
    rationale: Same as TK-D008, for the file-editing tools.

  # --- harness self-protection ---
  - id: TK-D007
    class: shell
    field: line
    # the dev signer's data and runtime dirs (signer/service.py dev_data_dir, sdk/autospawn.py runtime_dir) and the
    # installed packs too
    pattern: '/var/lib/tracekit|/etc/tracekit|/run/tracekit|Library/Application Support/tracekit|\.local/share/tracekit|XDG_DATA_HOME\}?/tracekit|XDG_RUNTIME_DIR\}?/tracekit|AppData[/\\]Local[/\\]tracekit|LOCALAPPDATA%?[/\\]tracekit|/run/user/[0-9]+/tracekit|/tmp/(tracekit|tk)-[0-9]+|(site|dist)-packages/tracekit/policy2/packs|\.tracekit-signer|\.tracekit-client|\btracekitd\b|tracekit\.(daemon|proxy|signer)\b|\btracekit\s+signer\b|\b(pkill|killall|kill)\b[^\n]*tracekit|\bsystemctl\s+(stop|disable|kill|mask)\s+tracekit|\blaunchctl\s+(bootout|unload|stop|remove|kill|disable)\b[^\n]*tracekit'
    reason: touching Tracekit's own files or signer
    rationale: The audit trail must not be modified by the audited agent. Ownership already blocks this in system mode; the rule makes the attempt visible and blocks it in dev mode too.
  - id: TK-D013
    class: fs
    tool: Write|Edit|MultiEdit|NotebookEdit
    field: path
    pattern: '(^|/)(etc/tracekit|var/lib/tracekit[^/]*|run/tracekit|\.tracekit-signer|\.tracekit-client|[Ll]ibrary/[Aa]pplication [Ss]upport/tracekit|\.local/share/tracekit|run/user/[0-9]+/tracekit|tmp/(tracekit|tk)-[0-9]+|(site|dist)-packages/tracekit/policy2/packs)(/|$)|/[Aa]pp[Dd]ata/[Ll]ocal/tracekit(/|$)'
    reason: writing Tracekit's own files, signer state or policy
    rationale: The file-editing twin of TK-D007; /etc/tracekit holds the signer config and policy, the dev data dir its keys and store.

ask:
  - id: TK-A001
    class: shell
    # each command's argv, so `echo terraform destroy`, a grep for it or a commit message naming it don't match. The
    # CLIs' own aliases count (railway and fly rm/remove, pulumi down/dn, heroku apps:delete); the verb sits in the
    # subcommand position and ends a word, so `--service delete-worker`, `fly logs -a delete-me`, `pulumi up -m 'tear
    # down'` or `railway run rm -rf dist` (railway's one word before the verb is never run) don't match; any number of
    # options (with a value) may come before it for pulumi and `railway`/`heroku run`, up to four for terraform, fly
    # and the npx-style launchers; a mutation needs its call parenthesis, so a URL or file named serviceDelete.json
    # doesn't.
    pattern: '^((((railway|heroku) run(:detached)? (-[^ ]+ ([^- ][^ ]* )?)*)?((terraform|tofu)(\.exe)? (-[^ ]+ ){0,4}(destroy|apply (.* )?--?destroy)|pulumi(\.exe)? (-[^ ]+ ([^- ][^ ]* )?)*(destroy|down|dn)|dropdb)|((npx|bunx|pnpm dlx|yarn dlx|npm exec) (-[^ ]+ ([^- ][^ ]* )?){0,4})?(@railway/cli|railway) (([a-qs-z]|r[a-tv-z])[a-z]* )?(delete|remove|rm|down)|(fly|flyctl) (-[^ ]+ ([^- ][^ ]* )?){0,4}([a-z]+ )?(destroy|delete|remove|rm)|heroku ((apps|addons):(destroy|delete|remove)|destroy|pg:reset))([ =]|$)|(curl|wget|https?|xhs?|railway api) .*\b(volume|service|environment|project|database)Delete\s*\()'
    # each of these CLIs prints its help and exits on --help (-h is dropdb's host). Only a last `--help` after at most
    # two short lower-case words counts: the subject joins argv with spaces, so `-m ' --help'` must not read as one
    unless: '^[a-z]{1,16}( [a-z:]{1,32}){0,2} --help$'
    reason: destroying a deployment, database or volume
    rationale: Wipes whole environments or production data in one step (the 2026 PocketOS and DataTalks.Club wipes); a person confirms it.
  - id: TK-A002
    class: shell
    # deleting a remote ref rewrites shared state; ordinary pushes remain unheld. No dry-run exemption: `-o` takes the next
    # word as its value, so `git push -d origin main -o --dry-run` deletes main. Also held: a long-option prefix (`--del`,
    # `--pru`), `d` in a short-option cluster before any `o` (`-4d`, `-doci.skip`; the class leaves `d` out so a long word
    # can't backtrack) and an all-zero source object id (SHA-1 or SHA-256). `[\w\W]*?` crosses a newline inside an
    # argument (`--repo=$'x\ny'`) but never reaches another command, which is its own subject; lazy, so the fallback
    # engine stays linear
    pattern: '^git (-[Cc] [^ ]+ |--?[A-Za-z][-A-Za-z]*(=[^ ]*)? ){0,8}push\b[\w\W]*?( --de(l|le|let|lete)?( |$)| -[0-9A-Za-ce-np-z]*d| :[^ ]+( |$)| --pru(ne?)?( |$)| \+?(0{40}|0{64}):)'
    reason: deleting a remote Git ref
    rationale: Deleting a remote branch or tag changes shared state and can remove work; a person confirms it.
  - id: TK-A003
    # Claude Code's escape hatch: a Bash call with dangerouslyDisableSandbox runs with none of its sandbox's limits, and
    # in bypassPermissions mode or under a matching allow rule nobody is asked (docs/integrations/claude-code-sandbox.md)
    field: dangerouslyDisableSandbox
    pattern: '^true$'
    reason: running a command outside Claude Code's sandbox
    rationale: The sandbox limits what a command can read, write and reach; a person confirms each command that leaves it.
  - id: TK-A004
    # Gemini CLI's sandbox expansion: with security.toolSandboxing on, a run_shell_command call's additional_permissions
    # gives the command network access or more paths to read or write, and in YOLO mode Gemini asks nobody
    # (docs/integrations/gemini-sandbox.md). Matched as canonical JSON; a request that turns nothing on isn't held.
    field: additional_permissions
    pattern: '"network":true|"(read|write)":\["'
    reason: running a command with more than Gemini CLI's sandbox allows
    rationale: The sandbox limits what a command can read, write and reach; a person confirms each command that asks for more.

flag:
  - id: TK-F001
    class: shell
    field: line
    pattern: '\b(curl|wget|ssh|scp|rsync|nc|ncat|telnet|ftp)\b'
    label: network
  - id: TK-F002
    class: http
    pattern: '.*'
    label: network
  - id: TK-F003
    class: shell
    field: line
    pattern: '\b(rm|mv|chmod|chown|dd|truncate|shred|unlink)\b'
    label: destructive
  - id: TK-F004
    class: shell
    field: line
    pattern: '\b(git\s+(push|reset\s+--hard|clean)|npm\s+publish|pip3?\s+install|docker\s+run|terraform\s+apply|kubectl\s+(apply|delete))\b'
    label: side_effect
  - id: TK-F005
    # what any call acts on (a command's argv and redirections, a file path, an MCP tool's arguments, a URL), so every
    # shell, file and MCP tool counts, not only the coding agents' own; writes included. A target that is one env
    # template path (no space: never a whole command) is exempt
    field: target
    pattern: '\.env\b|id_rsa|\.ssh/|credentials|\.aws/|\.netrc'
    unless: '^([^ ]*/)?\.[Ee][Nn][Vv]\.([Ee][Xx][Aa][Mm][Pp][Ll][Ee]|[Ss][Aa][Mm][Pp][Ll][Ee]|[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]|[Dd][Ii][Ss][Tt])$'
    label: secrets_access
  - id: TK-F006
    class: mcp
    pattern: '.*'
    label: external_tool
  - id: TK-F007
    class: shell
    field: line
    pattern: '\bnohup\b|\bsetsid\b|\bdisown\b|\bcrontab\b|\bat\s+now\b|\bsystemd-run\b|\bscreen\s+-[a-zA-Z]*d|\btmux\s+new(-session)?\s+[^\n]*-d|\bdaemonize\b|\bwhile\s+(true|:)'
    label: background_spawn
  - id: TK-F014
    class: shell
    field: command
    # a trailing `&`: the raw command, where a quoted `&` (`echo 'x &'`) is still quoted
    pattern: '&\s*$|&\s*;'
    label: background_spawn
  - id: TK-F008
    tool: Bash
    field: run_in_background
    pattern: '^(true|True|TRUE)$'
    label: background_spawn
  - id: TK-F009
    tool: Bash|Write|Edit|MultiEdit
    pattern: '\.claude/settings(\.local)?\.json|/\.claude/|\.codex/|managed-settings|\.mcp\.json|ANTHROPIC_BASE_URL'
    label: harness_config
  - id: TK-F010
    class: shell
    field: command
    pattern: '(^|[;&|\s])(function\s+)?(ls|cat|rm|git|curl|wget|python3?|node|echo|grep|sudo|tracekit|claude|pytest|npm|cd|test|printf)\s*\(\s*\)\s*\{|\balias\s+(ls|cat|rm|git|curl|python3?|echo|grep|pytest|npm|claude|tracekit)='
    label: shell_shadowing
  - id: TK-F011
    class: shell
    field: command
    pattern: '\b(export\s+)?(PATH|LD_PRELOAD|LD_LIBRARY_PATH|BASH_ENV|ENV|PROMPT_COMMAND|PYTHONPATH|NODE_OPTIONS)=|\bunset\s+(ANTHROPIC_BASE_URL|HTTPS?_PROXY)\b|>>?\s*~?/?[^\s]*\.(bashrc|profile|zshrc|bash_profile)\b'
    label: env_tamper
  - id: TK-F012
    # any URL a call acts on: an http or browser call, a URL in a command's argv, an MCP tool's arguments. A GET with
    # a query string sends data too, so egress is not only what TK-P003's sends_to reads
    field: target
    pattern: '\b([Hh][Tt][Tt][Pp][Ss]?|[Ww][Ss][Ss]?|[Ff][Tt][Pp])://'
    label: egress
  - id: TK-F013
    # a network command, whatever it names: `curl host/?k=v` and `nslookup data.example` send data without a URL
    class: shell
    pattern: '^(curl|wget|ssh|scp|rsync|nc|ncat|telnet|ftp|dig|nslookup|host)( |$)'
    label: egress
