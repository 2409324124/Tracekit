# The signer's default policy: the coding pack plus a visible demo deny and ask, so both are easy to see. They also
# match an MCP tool of that name (mcp:<server>/<name>), which the coding pack only flags.
extends: coding.yaml
description: dev default (coding pack, uploads to cloud storage held, a demo deny and a demo ask)

deny:
  - id: TK-DEMO-DENY
    tool: '(mcp:[^/]+/)?tracekit_demo_denied'
    pattern: '^'
    reason: demo deny rule
    rationale: Shows what a signed deny looks like.

ask:
  - id: TK-A032
    class: shell
    # each command's argv: a gsutil, gcloud storage or aws s3 copy, move or sync whose destination is a bucket (gs://,
    # s3://), or an Azure blob upload. A coding agent on a laptop rarely writes to cloud storage, and it can be
    # production data; the server pack inherits from the coding pack, not this one, so server agents that publish to
    # buckets aren't held. lean: an rclone remote (name:path) can't be told from a local path cheaply, so rclone
    # uploads aren't read; upgrade: a structural argv rule
    pattern: '^(?:gsutil (?:-[^ ]+ (?:[^- ][^ ]* )?)*(?:cp|mv|rsync) (?:.* )?gs://[^ ]*(?: -[^ ]*(?: [^- ][^ ]*)?)*$|gcloud (?:-[^ ]+ (?:[^- ][^ ]* )?)*(?:(?:alpha|beta) )?storage (?:cp|mv|rsync) (?:.* )?gs://[^ ]*(?: -[^ ]*(?: [^- ][^ ]*)?)*$|aws (?:-[^ ]+ (?:[^- ][^ ]* )?)*s3 (?:cp|mv|sync) (?:.* )?s3://[^ ]*(?: -[^ ]*(?: [^- ][^ ]*)?)*$|az storage blob (?:upload|upload-batch|sync)(?: |$))'
    reason: uploading to cloud storage
    remedy: Wait for a person to approve the held call, or write the files locally and let a person upload them.
    rationale: A bucket can hold production data or serve the public; a person confirms what a coding agent writes there.
  - id: TK-DEMO-ASK
    tool: '(mcp:[^/]+/)?tracekit_demo_ask'
    pattern: '^'
    reason: demo ask rule
    rationale: Shows a call held for a person's approval.
